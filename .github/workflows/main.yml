name: Build and publish binaries

# Build on push to tags (release) and allow manual runs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases and upload assets

env:
  BINARY_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    outputs:
      artifact-path: ${{ steps.package.outputs.path || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build entrypoints for ${{ matrix.os }}/${{ matrix.arch }}
        id: build
        run: |
          set -euo pipefail
          GOOS=${{ matrix.os }}
          GOARCH=${{ matrix.arch }}
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist

          PACKAGES=("cmd/lixy" "cmd/lixy/cli" "cmd/lixies" "cmd/lixies/cli")
          for pkg in "${PACKAGES[@]}"; do
            # derive binary base name from folder: cmd/lixy -> lixy, cmd/lixy/cli -> lixy-cli
            rel="${pkg#cmd/}"
            bin=$(echo "$rel" | tr '/' '-')
            out="dist/${bin}-${GOOS}-${GOARCH}${ext}"
            echo "Building ${pkg} -> ${out}"
            env GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "-s -w" -o "${out}" "./${pkg}"
            ls -lh "${out}"
          done

      - name: Package binaries for ${{ matrix.os }}/${{ matrix.arch }}
        id: package
        run: |
          set -euo pipefail
          GOOS=${{ matrix.os }}
          GOARCH=${{ matrix.arch }}
          mkdir -p release
          OUT="release/${BINARY_NAME}-${GOOS}-${GOARCH}.tar.gz"
          # archive the matrix-specific dist outputs
          tar -C dist -czf "$OUT" .
          # Use the recommended GITHUB_OUTPUT mechanism (set-output is deprecated)
          echo "path=$OUT" >> $GITHUB_OUTPUT

          # Append a short summary to the actions summary (if available)
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Build artifact for ${GOOS}/${GOARCH}"
              echo ""
              echo "- **File:** $OUT"
              echo "- **Built on:** $(date --utc +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.path }}

  publish:
    name: Create release and publish binaries
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: Automated release for ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upload_url='${{ steps.create_release.outputs.upload_url }}'
          upload_url="${upload_url%\{*}"
          echo "upload url: $upload_url"
          for f in release/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading $name ..."
            curl -sS -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "$upload_url?name=$name"
          done