name: Build and publish binaries

# Build on push to tags (release) and allow manual runs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases and upload assets

env:
  BINARY_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: darwin
            arch: arm64
    outputs:
      artifact-path: ${{ steps.package.outputs.path || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build entrypoints for ${{ matrix.os }}/${{ matrix.arch }}
        id: build
        env:
          # expose the ref name to the script; empty on non-tag runs -> fallback to 'dev'
          GITHUB_REF_NAME: ${{ github.ref_name }}
          MODULE: github.com/MinaroShikuchi/lixy
        run: |
          set -euo pipefail
          GOOS=${{ matrix.os }}
          GOARCH=${{ matrix.arch }}
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist

          # compute a stable version string (tag name or dev)
          VERSION="${GITHUB_REF_NAME:-dev}"

          PACKAGES=("cmd/lixy" "cmd/lixy/cli" "cmd/lixies" "cmd/lixies/cli")
          for pkg in "${PACKAGES[@]}"; do
            # derive a unique binary name from the package path after cmd/
            rel="${pkg#cmd/}"
            bin=$(echo "$rel" | tr '/' '-')
            out="dist/${bin}-${GOOS}-${GOARCH}${ext}"
            pkgpath="${MODULE}/${pkg}" # e.g. github.com/MinaroShikuchi/lixy/cmd/lixy or .../cmd/lixy/cli

            # set Version variable in the main package of the target module
            ldflags="-s -w -X ${pkgpath}/main.Version=${VERSION}"

            echo "Building ${pkg} -> ${out} (ldflags: ${ldflags})"
            env GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "${ldflags}" -o "${out}" "./${pkg}"
            ls -lh "${out}"
          done

      - name: Package binaries for ${{ matrix.os }}/${{ matrix.arch }}
        id: package
        run: |
          set -euo pipefail
          GOOS=${{ matrix.os }}
          GOARCH=${{ matrix.arch }}
          mkdir -p release
          OUT="release/${BINARY_NAME}-${GOOS}-${GOARCH}.tar.gz"
          # archive the matrix-specific dist outputs
          tar -C dist -czf "$OUT" .
          # Use the recommended GITHUB_OUTPUT mechanism (set-output is deprecated)
          echo "path=$OUT" >> $GITHUB_OUTPUT

          # Append a short summary to the actions summary (if available)
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Build artifact for ${GOOS}/${GOARCH}"
              echo ""
              echo "- **File:** $OUT"
              echo "- **Built on:** $(date --utc +%Y-%m-%dT%H:%M:%SZ)"
              echo "- **Version:** ${GITHUB_REF_NAME:-dev}"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.path }}

  publish:
    name: Create release and publish binaries
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Determine tag to release.
          # If workflow triggered by tag push, GITHUB_REF will be "refs/tags/<tag>"
          if [[ "${GITHUB_REF:-}" =~ refs/tags/(.+) ]]; then
            TAG=${BASH_REMATCH[1]}
          else
            echo "No tag detected in GITHUB_REF; failing."
            exit 1
          fi

          echo "Creating release for tag: $TAG"

          # Build release JSON. Adjust name/body/prerelease/draft as needed.
          body=$(jq -c -n --arg tag "$TAG" \
            '{ tag_name: $tag, name: $tag, body: ("Release " + $tag), draft: false, prerelease: false }')

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"

          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$body" \
            "$api")

          # exit on API error
          if echo "$resp" | jq -e 'has("id") | not' >/dev/null; then
            echo "Failed to create release. Response:"
            echo "$resp"
            exit 1
          fi

          # extract upload_url and strip the templated part
          upload_url=$(echo "$resp" | jq -r '.upload_url' | sed -e 's/{?name,label}//')
          echo "upload_url=$upload_url" >> $GITHUB_OUTPUT
          echo "release_id=$(echo "$resp" | jq -r '.id')" >> $GITHUB_OUTPUT

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          upload_url="${{ steps.create_release.outputs.upload_url }}"
          if [ -z "$upload_url" ]; then
            echo "No upload_url available"
            exit 1
          fi

          # find all files in the release directory (downloaded artifacts) and upload each as a separate asset
          shopt -s nullglob

          ls -al release/
          
          files=(release/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files found in release/ to upload"
            ls -al release || true
            exit 1
          fi

          for asset_path in "${files[@]}"; do
            if [ ! -f "$asset_path" ]; then
              echo "Skipping non-file: $asset_path"
              continue
            fi

            asset_name=$(basename "$asset_path")
            # set sensible content types for common archive/binary formats
            content_type="application/octet-stream"
            case "$asset_name" in
              *.tar.gz|*.tgz) content_type="application/gzip" ;;
              *.zip) content_type="application/zip" ;;
              *.exe) content_type="application/vnd.microsoft.portable-executable" ;;
            esac

            # URL-encode asset name for the upload query param using jq
            encoded_name=$(jq -rn --arg v "$asset_name" '$v|@uri')

            echo "Uploading $asset_name (content-type: $content_type) to $upload_url"

            resp=$(curl -sS --fail -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: $content_type" \
              --data-binary @"$asset_path" \
              "$upload_url?name=$encoded_name") || { echo "Asset upload failed for $asset_name"; echo "$resp"; exit 1; }

            # basic validation of response
            if echo "$resp" | jq -e 'has(\"id\")' >/dev/null; then
              echo "Uploaded $asset_name"
            else
              echo "Unexpected response uploading $asset_name:"
              echo "$resp"
              exit 1
            fi
          done